name: Release npmjs.com

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref or tag to publish from
        required: false
        type: string

permissions:
  contents: read
  id-token: write

env:
  RELEASE_REF: ${{ inputs.ref || github.event.release.tag_name || github.ref_name }}

jobs:
  verify-npm:
    name: Verify npm package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack artifact
        run: npm run pack:artifact

      - name: Upload npm artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz

  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    needs:
      - verify-npm
    environment:
      name: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check version alignment
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')
          NPM_VERSION=$(node -p "require('./package.json').version")
          if [ "$CARGO_VERSION" != "$NPM_VERSION" ]; then
            echo "Cargo version $CARGO_VERSION does not match npm version $NPM_VERSION"
            exit 1
          fi

      - name: Build npm package
        run: npm run build

      - name: Publish npm package
        run: npm publish