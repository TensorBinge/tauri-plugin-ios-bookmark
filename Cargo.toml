[package]
name = "tauri-plugin-ios-bookmark"
version = "0.1.0"
edition = "2021"
description = "iOS security-scoped bookmark plugin for Tauri 2"
license = "MIT"
links = "tauri-plugin-ios-bookmark"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
